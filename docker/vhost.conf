<VirtualHost *:10000>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the app internals even if something is misconfigured.
    <DirectoryMatch "^/var/www/html/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    # Render terminates TLS at its edge and forwards X-Forwarded-*.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
